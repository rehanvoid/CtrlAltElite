<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>GLITCH ESCAPE</title><style>
:root{--bg:#05060d;--ed:#0ff4;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{margin:0;height:100%;background:var(--bg);display:flex;align-items:center;justify-content:center}
canvas{max-width:100%;max-height:100%;border:1px solid var(--ed);box-shadow:0 0 30px #0ff3}
</style></head><body><canvas id="c" width="960" height="590"></canvas><script>
const C=document.getElementById('c'),X=C.getContext('2d'),T=30,W=960;
const LV=[
{n:'BROKEN BEGINNING',t:90,h:'Q flips gravity: walk on the ceiling to cross floor traps',f:(P,L)=>{P('^',8,17,6);P('o',9,1,4);P('c',14,16);P('^',16,16,6);P('o',17,1,4);P('c',23,16);P('^',25,1,6);P('#',27,14,3);P('o',28,13);P('o',4,15);P('E',30,16)}},
{n:'FROZEN SYSTEM',t:100,h:'E freezes lasers and saws: slip through while time is stopped',f:(P,L)=>{L.l=[[8,1,16,1,1.2,0],[11,1,16,1,1.2,.8],[14,1,16,1,1.2,1.6]];L.m=[[19,2,19,16.2,5,13],[22,16.2,22,2,5,13],[24,12,29,12,3,12]];P('c',16,16);P('#',24,14,2);P('#',27,11,2);P('#',29,9,2);P('E',30,8);P('o',9,15);P('o',12,15);P('o',20,15);P('o',25,13);P('o',28,10);P('o',3,15)}},
{n:'PARALLEL REALITY',t:110,h:'R switches dimension: magenta and orange platforms are solid only in one',f:(P,L)=>{L.sx=2;L.sy=11;L.m=[[16,3,16,13,3,12],[21,3,21,12,3.5,12]];P('^',1,16,30);P('#',1,12,4);P('g',7,12,3);P('n',12,11,3);P('g',17,10,3);P('n',22,9,3);P('#',26,10,5);P('c',26,9);P('n',28,1,1,9);P('E',30,9);P('o',3,11);P('o',8,11);P('o',13,10);P('o',18,9);P('o',23,8)}},
{n:'FINAL SYSTEM CRASH',t:120,h:'Dash (Shift) through hatched walls. Combine everything.',f:(P,L)=>{L.l=[[12,1,15,1,1.3,0],[14,1,15,1,1.3,1.1]];L.m=[[21,8,28,8,3.2,12]];P('W',6,1,1,16);P('^',10,16,21);P('#',17,16,3);P('c',18,15);P('g',21,13,2);P('n',25,12,2);P('#',28,10,3);P('W',29,1,1,9);P('E',30,9);P('o',3,15);P('o',8,15);P('o',13,1);P('o',16,1);P('o',21,12);P('o',26,11);P('o',28,9)}}];
let S='menu',li=0,L,p,dim=0,hazT=0,fT=0,fCD=0,dCD=0,gCD=0,mCD=0,dash=0,dashing=false,remain=0,deaths=0,frags=0,fTot=0,lvS=0,tot=0,cp,deadT=0,shake=0,gl=0,ban=0,bd={},parts=[],bgT=0;
function build(i){const g=[...Array(18)].map((_,y)=>[...Array(32)].map((_,x)=>x%31==0||y%17==0?'#':'.'));const L={g,m:[],l:[],sx:2,sy:16};const P=(c,x,y,w=1,h=1)=>{for(let j=0;j<h;j++)for(let k=0;k<w;k++)g[y+j][x+k]=c};LV[i].f(P,L);return L}
function load(i){li=i;L=build(i);remain=LV[i].t;deaths=0;frags=0;fTot=L.g.flat().filter(c=>c=='o').length;cp={x:L.sx,y:L.sy};hazT=0;parts=[];S='play';ban=3.5;respawn()}
function respawn(){p={x:cp.x*T+6,y:(cp.y+1)*T-26,w:18,h:26,vx:0,vy:0,gd:1,on:false,face:1,co:0,jb:0};dim=0;fT=0;dashing=false;dash=0}
let AC;function initA(){if(!AC)try{AC=new AudioContext()}catch(e){}}
function sfx(f,d,t='square',f2){if(!AC)return;const n=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();o.type=t;o.frequency.setValueAtTime(f,n);if(f2)o.frequency.exponentialRampToValueAtTime(f2,n+d);g.gain.setValueAtTime(.06,n);g.gain.exponentialRampToValueAtTime(.001,n+d);o.connect(g).connect(AC.destination);o.start();o.stop(n+d)}
function burst(x,y,c,n){for(let i=0;i<n;i++){const a=Math.random()*6.28,s=60+Math.random()*180;parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:.3+Math.random()*.4,c})}}
const K={};
addEventListener('keydown',e=>{if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code))e.preventDefault();initA();if(!K[e.code])press(e.code);K[e.code]=1});
addEventListener('keyup',e=>K[e.code]=0);
function press(k){
if(S=='menu'){if(k=='Enter'||k=='Space'){tot=0;load(0)}}
else if(S=='play'){
if(k=='Escape'||k=='KeyP'){S='pause';return}
if(deadT>0)return;
if(['Space','KeyW','ArrowUp'].includes(k))p.jb=.12;
if(k=='KeyQ'&&gCD<=0){p.gd*=-1;p.vy=0;gCD=.35;sfx(300,.15,'sawtooth',900);burst(p.x+9,p.y+13,'#0ff',10)}
if(k=='KeyE'&&fCD<=0){fT=3;fCD=8;sfx(900,.5,'sine',150)}
if(k=='KeyR'&&mCD<=0){mCD=.3;dim^=1;if(hit(p.x,p.y,p.w,p.h)){dim^=1;sfx(110,.2)}else{gl=.25;sfx(500,.2,'square',90)}}
if((k=='ShiftLeft'||k=='ShiftRight')&&dCD<=0){dash=.14;dashing=true;dCD=.8;sfx(220,.15,'sawtooth',60)}}
else if(S=='pause'){if(k=='Escape'||k=='KeyP'||k=='Enter')S='play';if(k=='KeyR')load(li);if(k=='KeyM')S='menu'}
else if(S=='over'){if(k=='Enter')load(li);if(k=='KeyM')S='menu'}
else if(S=='end'){if(k=='Enter'){li<3?load(li+1):S='win'}}
else if(S=='win'&&k=='Enter')S='menu'}
const solid=(tx,ty)=>{if(tx<0||tx>31||ty<0)return true;if(ty>17)return false;const c=L.g[ty][tx];return c=='#'||c=='g'&&dim==1||c=='n'&&!dim||c=='W'&&!dashing};
function hit(x,y,w,h,f=solid){for(let ty=Math.floor(y/T);ty<=Math.floor((y+h-.01)/T);ty++)for(let tx=Math.floor(x/T);tx<=Math.floor((x+w-.01)/T);tx++)if(f(tx,ty))return true;return false}
const lon=l=>((hazT+l[5])%(l[3]+l[4]))<l[3];
function mp(m){const dx=(m[2]-m[0])*T,dy=(m[3]-m[1])*T,len=Math.hypot(dx,dy),d=(hazT*m[4]*T)%(2*len),f=(d<len?d:2*len-d)/len;return[m[0]*T+dx*f,m[1]*T+dy*f]}
function move(dt){
const ax=(K.KeyD||K.ArrowRight?1:0)-(K.KeyA||K.ArrowLeft?1:0);
if(!dashing){p.vx=ax*220;if(ax)p.face=ax;p.vy=Math.max(-900,Math.min(900,p.vy+1800*p.gd*dt))}else{p.vx=p.face*650;p.vy=0}
p.x+=p.vx*dt;
if(p.vx&&hit(p.x,p.y,p.w,p.h)){p.x=p.vx>0?Math.floor((p.x+p.w)/T)*T-p.w-.01:(Math.floor(p.x/T)+1)*T+.01}
p.y+=p.vy*dt;p.on=false;
if(hit(p.x,p.y,p.w,p.h)){p.y=p.vy>0?Math.floor((p.y+p.h)/T)*T-p.h-.01:(Math.floor(p.y/T)+1)*T+.01;if(p.vy*p.gd>0)p.on=true;p.vy=0}}
function die(){deadT=.7;deaths++;shake=14;burst(p.x+9,p.y+13,'#f05',30);sfx(150,.5,'sawtooth',30)}
function done(){S='end';sfx(500,.5,'triangle',1400);const tb=Math.floor(remain)*10,fb=frags*200,db=deaths*100;bd={tb,fb,db};lvS=Math.max(0,500+tb+fb-db);tot+=lvS}
function inter(){
const x0=Math.floor(p.x/T),x1=Math.floor((p.x+p.w)/T),y0=Math.floor(p.y/T),y1=Math.floor((p.y+p.h)/T);
for(let ty=y0;ty<=y1;ty++)for(let tx=x0;tx<=x1;tx++){const c=L.g[ty]&&L.g[ty][tx];if(!c)continue;
if(c=='o'){L.g[ty][tx]='.';frags++;sfx(900,.12,'sine',1600);burst(tx*T+15,ty*T+15,'#ff0',12)}
else if(c=='c'&&(cp.x!=tx||cp.y!=ty)){cp={x:tx,y:ty};sfx(600,.2,'triangle',1000);burst(tx*T+15,ty*T+15,'#0f8',16)}
else if(c=='E')return done();
else if(c=='^'&&p.x+p.w>tx*T+7&&p.x<tx*T+T-7&&p.y+p.h>ty*T+7&&p.y<ty*T+T-7)return die()}
for(const l of L.l)if(lon(l)&&p.x+p.w>l[0]*T+12&&p.x<l[0]*T+18&&p.y+p.h>l[1]*T&&p.y<(l[2]+1)*T)return die();
for(const m of L.m){const[mx,my]=mp(m),cx=Math.max(p.x,Math.min(mx,p.x+p.w)),cy=Math.max(p.y,Math.min(my,p.y+p.h));if(Math.hypot(mx-cx,my-cy)<m[5]-2)return die()}
if(p.y>600)die()}
function upd(dt){
if(ban>0)ban-=dt;
parts=parts.filter(q=>(q.l-=dt)>0);parts.forEach(q=>{q.x+=q.vx*dt;q.y+=q.vy*dt});
if(Math.random()<dt*.4)gl=.12;gl-=dt;shake*=.9;
if(deadT>0){deadT-=dt;if(deadT<=0)respawn();return}
remain-=dt;if(remain<=0){remain=0;S='over';sfx(120,1,'sawtooth',30);return}
fCD-=dt;dCD-=dt;gCD-=dt;mCD-=dt;p.jb-=dt;
if(fT>0)fT-=dt;else hazT+=dt;
p.co=p.on?.1:p.co-dt;
if(p.jb>0&&p.co>0){p.vy=-640*p.gd;p.jb=0;p.co=0;sfx(380,.12,'square',700)}
if(!(K.Space||K.KeyW||K.ArrowUp)&&p.vy*p.gd<-250)p.vy=-250*p.gd;
move(dt/2);move(dt/2);
if(dashing){dash-=dt;parts.push({x:p.x+9,y:p.y+13,vx:0,vy:0,l:.25,c:'#fa0'});if(dash<=0&&!hit(p.x,p.y,p.w,p.h,(a,b)=>L.g[b]&&L.g[b][a]=='W')||dash<-.5)dashing=false}
inter()}
function tiles(){
const A=dim?'#f0f':'#0ff';
for(let y=0;y<18;y++)for(let x=0;x<32;x++){const c=L.g[y][x];if(c=='.')continue;const px=x*T,py=y*T;
if(c=='#'){X.fillStyle=dim?'#1c0830':'#0a1c30';X.fillRect(px,py,T,T);X.strokeStyle=A;X.strokeRect(px+.5,py+.5,T-1,T-1)}
else if(c=='g'||c=='n'){const on=c=='g'?dim==1:!dim,col=c=='g'?'#f0f':'#fa0';X.globalAlpha=on?1:.25;X.fillStyle=on?col+'44':'#0000';X.fillRect(px,py,T,T);X.strokeStyle=col;X.setLineDash(on?[]:[4,4]);X.strokeRect(px+1.5,py+1.5,T-3,T-3);X.setLineDash([]);X.globalAlpha=1}
else if(c=='W'){X.fillStyle='#fa02';X.fillRect(px,py,T,T);X.strokeStyle='#fa0';X.globalAlpha=.6+Math.random()*.4;X.beginPath();for(let k=0;k<T;k+=8){X.moveTo(px,py+k);X.lineTo(px+k,py);X.moveTo(px+T,py+k);X.lineTo(px+k,py+T)}X.stroke();X.globalAlpha=1}
else{X.shadowBlur=12;
if(c=='^'){const dn=L.g[y-1]&&L.g[y-1][x]=='#'&&y<2;X.fillStyle=X.shadowColor='#f05';X.beginPath();for(let k=0;k<2;k++){const bx=px+k*15;X.moveTo(bx,dn?py:py+T);X.lineTo(bx+7.5,dn?py+T:py);X.lineTo(bx+15,dn?py:py+T)}X.fill()}
else if(c=='o'){const b=Math.sin(bgT*4+x)*3;X.fillStyle=X.shadowColor='#ff0';X.beginPath();X.moveTo(px+15,py+5+b);X.lineTo(px+23,py+15+b);X.lineTo(px+15,py+25+b);X.lineTo(px+7,py+15+b);X.fill()}
else if(c=='c'){const on=cp.x==x&&cp.y==y;X.fillStyle=X.shadowColor=on?'#0f8':'#486';X.fillRect(px+13,py+4,3,26);X.fillRect(px+16,py+4,10,8)}
else if(c=='E'){X.shadowColor=X.strokeStyle='#0f8';X.lineWidth=2;for(let k=0;k<3;k++){X.beginPath();X.ellipse(px+15,py+15,5+k*4+Math.sin(bgT*5+k)*2,12-k*2,bgT*2+k,0,6.3);X.stroke()}X.lineWidth=1}
X.shadowBlur=0}}}
function hazards(){
const col=fT>0?'#8ff':'#f05';
for(const l of L.l){const x=l[0]*T+15,y1=l[1]*T,y2=(l[2]+1)*T,ph=(hazT+l[5])%(l[3]+l[4]),warn=ph>=l[3]&&l[3]+l[4]-ph<.4;
X.fillStyle=col;X.fillRect(x-6,y1,12,5);X.fillRect(x-6,y2-5,12,5);
if(lon(l)){X.shadowColor=col;X.shadowBlur=16;X.fillStyle=col;X.fillRect(x-3,y1,6,y2-y1);X.fillStyle='#fff';X.fillRect(x-1,y1,2,y2-y1);X.shadowBlur=0}
else{X.globalAlpha=warn?.3+Math.random()*.5:.12;X.fillStyle=col;X.fillRect(x-1,y1,2,y2-y1);X.globalAlpha=1}}
for(const m of L.m){const[mx,my]=mp(m),r=m[5];X.save();X.translate(mx,my);X.rotate(hazT*8);X.shadowColor=col;X.shadowBlur=14;X.fillStyle=col;X.beginPath();for(let k=0;k<16;k++){const a=k*Math.PI/8,rr=k%2?r*.6:r+3;X.lineTo(Math.cos(a)*rr,Math.sin(a)*rr)}X.fill();X.fillStyle='#200';X.beginPath();X.arc(0,0,r*.3,0,6.3);X.fill();X.restore()}
X.shadowBlur=0}
function player(){
if(deadT>0)return;const{x,y}=p,col=dim?'#f6f':'#0ff';
if(gl>0){X.fillStyle='#f004';X.fillRect(x-4,y,18,26);X.fillStyle='#0ff4';X.fillRect(x+4,y,18,26)}
X.shadowColor=col;X.shadowBlur=14;X.fillStyle=col;X.fillRect(x,y,18,26);X.shadowBlur=0;X.fillStyle='#021';X.fillRect(x+(p.face>0?10:2),p.gd>0?y+6:y+14,6,6)}
function ov(t,ls,c='#0ff',big=56){X.fillStyle='rgba(2,3,10,.82)';X.fillRect(0,0,W,590);X.textAlign='center';X.font='bold '+big+'px monospace';X.fillStyle='#f05';X.fillText(t,W/2+3+(Math.random()<.1?8:0),170);X.fillStyle=c;X.shadowColor=c;X.shadowBlur=18;X.fillText(t,W/2,168);X.shadowBlur=0;X.font='18px monospace';ls.forEach((s,i)=>{X.fillStyle=s[0]=='>'?'#ff0':'#cff';X.fillText(s.replace(/^>/,''),W/2,240+i*32)});X.textAlign='left'}
const AB=[['Q','GRAVITY FLIP',()=>1-gCD/.35],['E','TIME FREEZE',()=>fT>0?1:1-fCD/8],['R','DIMENSION',()=>1-mCD/.3],['SHIFT','GLITCH DASH',()=>1-dCD/.8]];
function hud(){
X.fillStyle='#070914';X.fillRect(0,540,W,50);X.font='14px monospace';X.fillStyle=remain<20?'#f05':'#0ff';
X.fillText(`LV${li+1} ${LV[li].n}   CRASH IN ${remain.toFixed(1)}s   DATA ${frags}/${fTot}   DEATHS ${deaths}   SCORE ${tot}`,10,557);
AB.forEach((a,i)=>{const x=10+i*236,f=Math.max(0,Math.min(1,a[2]()));X.strokeStyle='#0ff8';X.strokeRect(x+.5,564.5,225,20);X.fillStyle=f>=1?'#0ff3':'#0ff1';X.fillRect(x+1,565,224*f,19);X.fillStyle='#fff';X.font='12px monospace';X.fillText(`[${a[0]}] ${a[1]}`,x+8,579)})}
function draw(){
X.save();X.fillStyle=dim?'#12041c':'#050a14';X.fillRect(0,0,W,590);
X.strokeStyle=dim?'#f0f1':'#0ff1';X.beginPath();for(let i=0;i<=W;i+=60){X.moveTo(i,0);X.lineTo(i,540)}for(let j=(bgT*20)%60;j<=540;j+=60){X.moveTo(0,j);X.lineTo(W,j)}X.stroke();
if(shake>.5)X.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);
tiles();hazards();player();
parts.forEach(q=>{X.globalAlpha=Math.min(1,q.l*3);X.fillStyle=q.c;X.fillRect(q.x-2,q.y-2,4,4)});X.globalAlpha=1;
if(fT>0){X.fillStyle='#08f1';X.fillRect(0,0,W,540);X.fillStyle='#8ff';X.fillText('TIME FROZEN '+fT.toFixed(1),W/2-60,530)}
if(dim){X.fillStyle='#f0f0a';X.fillRect(0,0,W,540)}
X.restore();
if(gl>0)for(let i=0;i<4;i++){const sy=Math.random()*520,h=8+Math.random()*30;X.drawImage(C,0,sy,W,h,(Math.random()-.5)*40,sy,W,h)}
X.fillStyle='rgba(0,0,0,.14)';for(let y=0;y<540;y+=3)X.fillRect(0,y,W,1);
hud();
if(S=='play'&&ban>0){X.globalAlpha=Math.min(1,ban);X.textAlign='center';X.font='bold 26px monospace';X.fillStyle='#ff0';X.fillText(`LEVEL ${li+1}: ${LV[li].n}`,W/2,90);X.font='15px monospace';X.fillStyle='#cff';X.fillText(LV[li].h,W/2,116);X.textAlign='left';X.globalAlpha=1}
if(S=='menu')ov('GLITCH ESCAPE',['You are trapped inside a corrupted simulation.','Escape all 4 sectors before the system crashes.','','MOVE: WASD / Arrows     JUMP: Space / W / Up     PAUSE: P / Esc','Q Gravity Flip   E Time Freeze   R Dimension Switch   SHIFT Glitch Dash','','>PRESS ENTER TO BOOT'],'#0ff',64);
if(S=='pause')ov('PAUSED',['>ENTER / P  Resume','R  Restart level','M  Main menu']);
if(S=='over')ov('SYSTEM CRASHED',['The simulation collapsed around you...','',`Score so far: ${tot}`,'>ENTER  Retry level','M  Main menu'],'#f05');
if(S=='end')ov('SECTOR CLEAR',[`Data fragments ${frags}/${fTot}   +${bd.fb}`,`Time bonus   +${bd.tb}`,`Deaths (${deaths})   -${bd.db}`,'Clear bonus   +500','',`LEVEL SCORE ${lvS}    TOTAL ${tot}`,'>ENTER  '+(li<3?'Next sector':'Finish')],'#0f8');
if(S=='win'){const r=tot>6000?'S':tot>4500?'A':tot>3000?'B':'C';ov('YOU ESCAPED',['The simulation shuts down. You are free.','',`FINAL SCORE ${tot}`,`RANK ${r}`,'','>ENTER  Main menu'],'#0f8')}}
load(0);S='menu';
let last=0;(function loop(t){const dt=Math.min(.033,(t-last)/1000||0);last=t;bgT+=dt;if(S=='play')upd(dt);else if(S=='menu')gl=Math.random()<.02?.1:gl-dt;draw();requestAnimationFrame(loop)})(0);
</script></body></html>
